name: Gemini AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare PR context
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .gemini
          
          jq -n \
            --arg repo "$REPOSITORY" \
            --arg pr "$PULL_REQUEST_NUMBER" \
            '{
              repository: $repo,
              pull_request_number: $pr,
              additional_context: "Review this as a Java/Spring Boot production codebase."
            }' > .gemini/context.json

      - name: Gemini PR Review
        id: gemini-review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

          github_pr_number: ${{ github.event.pull_request.number }}

          gemini_model: gemini-2.5-flash

          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]

          settings: |
            {
              "model": {
                "maxSessionTurns": 20
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_read",
                    "add_comment_to_pending_review",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }

          prompt: "/pr-code-review"