name: Gemini AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Gemini PR Review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

          # Explicitly select the free-tier model
          gemini_model: gemini-3.1-flash-lite

          # Tell Gemini exactly which PR it is reviewing
          github_pr_number: ${{ github.event.pull_request.number }}

          # Google's official PR review extension
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]

          # GitHub MCP configuration
          settings: |
            {
              "model": {
                "maxSessionTurns": 5
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_read",
                    "add_comment_to_pending_review",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }

          prompt: "/pr-code-review"