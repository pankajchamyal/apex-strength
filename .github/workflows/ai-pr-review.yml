name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Gemini Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini PR Review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review this pull request as a senior Java/Spring Boot engineer.

            Analyze ONLY the changes introduced by this PR.

            Look for:

            1. Correctness bugs
            2. Null pointer risks
            3. Incorrect exception handling
            4. Spring Boot issues
            5. Transaction problems
            6. Security vulnerabilities
            7. SQL/database issues
            8. Performance problems
            9. Concurrency/thread-safety issues
            10. REST API design problems
            11. Missing or inadequate tests
            12. Maintainability problems

            Do NOT complain about:
            - Formatting
            - Minor naming preferences
            - Personal coding style
            - Changes that are purely subjective

            Only report issues that are genuinely worth fixing.

            For every issue provide:
            - Severity: CRITICAL / HIGH / MEDIUM / LOW
            - File and line
            - What's wrong
            - Why it matters
            - Recommended fix

            If there are no meaningful issues, respond with:

            ## AI Review

            ✅ No significant issues found.